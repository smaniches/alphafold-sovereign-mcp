name: ClusterFuzzLite batch fuzzing

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # Mondays at 03:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  batch-fuzzing:
    name: Fuzz (batch, ${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
      - name: Verify committed fuzzer dependencies match uv.lock
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file .clusterfuzzlite/requirements.txt
          git diff --exit-code -- .clusterfuzzlite/requirements.txt
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: ${{ matrix.sanitizer }}
          # Batch fuzzing should retain every target without requiring prior coverage.
          keep-unaffected-fuzz-targets: true
      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event_name == 'push' && 300 || 1800 }}
          mode: batch
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
      - name: Upload SARIF to GitHub Security tab
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
