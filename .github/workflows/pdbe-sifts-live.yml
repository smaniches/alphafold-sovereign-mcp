name: PDBe SIFTS live residue audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/validate_pdbe_sifts_live.py
      - tests/test_pdbe_sifts_live_audit.py
      - .github/workflows/pdbe-sifts-live.yml

permissions:
  contents: read

jobs:
  live-audit:
    name: Independent residue evidence acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Offline verifier contract tests
        run: python -m unittest discover -s tests -p test_pdbe_sifts_live_audit.py -v
      - name: Retrieve real biological source records and perform read-only joins
        id: evidence
        run: python scripts/validate_pdbe_sifts_live.py --output evidence/pdbe-sifts-Q8VH51-495.json
      - name: Display bounded evidence summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('evidence/pdbe-sifts-Q8VH51-495.json')
          if not path.exists():
              print('No evidence report produced')
              raise SystemExit(1)
          audit = json.loads(path.read_text())
          lines = [
              '# Read-only PDBe / SIFTS validation',
              f"Overall (limited mapping scope): **{audit['overall']}**",
              f"UniProt: {audit['sequence_check']['status']}",
              f"Annotations: {audit['annotation_check']['status']}",
              f"SIFTS/PDB: {audit['structure_check']['status']}",
              'Upstream records are not clinical evidence.',
          ]
          print('\n'.join(lines))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('\n\n'.join(lines) + '\n')
          PY
      - name: Attach timestamped hash-bound evidence (without raw literature text)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pdbe-sifts-Q8VH51-495-evidence
          path: evidence/pdbe-sifts-Q8VH51-495.json
          if-no-files-found: warn
