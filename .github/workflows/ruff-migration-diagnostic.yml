name: Ruff migration diagnostic

on:
  push:
    branches: ["fix/refresh-production-deps-174"]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
      - name: Capture Ruff diagnostics
        run: |
          set +e
          {
            echo "== Ruff version =="
            uv sync --extra dev --locked --quiet
            uv run ruff --version
            echo
            echo "== Ruff check =="
            uv run ruff check src/ --output-format concise
            echo "ruff_check_exit=$?"
            echo
            echo "== Ruff format check =="
            uv run ruff format --check .
            echo "ruff_format_exit=$?"
          } > ruff-migration-diagnostic.txt 2>&1
          cat ruff-migration-diagnostic.txt
          exit 0
      - name: Upload Ruff diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruff-migration-diagnostic
          path: ruff-migration-diagnostic.txt
          if-no-files-found: error
