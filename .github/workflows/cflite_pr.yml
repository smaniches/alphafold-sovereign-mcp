name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    branches: [main]

permissions: read-all

# Avoid several expensive fuzzer builds from queued superseded commits
# when a contributor pushes multiple fixes to the same PR.
concurrency:
  group: cflite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-fuzzing:
    # Match the protected-main required check while reporting actual fuzzing results.
    name: ClusterFuzzLite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
      - name: Verify committed fuzzer dependencies match uv.lock
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file .clusterfuzzlite/requirements.txt
          git diff --exit-code -- .clusterfuzzlite/requirements.txt
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
          output-sarif: true
      - name: Upload SARIF to GitHub Security tab
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
          # Match the protected-main analysis category for merge protection.
          category: ".github/workflows/cflite_batch.yml:batch-fuzzing/sanitizer:address"
