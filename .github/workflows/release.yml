name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.1.0-rc1)"
        required: true
        type: string
      dry_run:
        description: "Resolve, build, and verify only — skip every privileged or externally mutating job (provenance, signing, GitHub release, PyPI, MCP Registry)"
        required: false
        type: boolean
        default: false

permissions: {}

# Serialize both tag-push and manual publication of the same release identity.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Resolve the release tag once, before any build or privileged publication.
  # Every source-reading job consumes the resulting immutable commit SHA, and
  # every privileged job consumes the single canonical dry_run output below.
  resolve_release:
    name: Resolve release identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      dry_run: ${{ steps.dry_run.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Canonical dry_run. On tag pushes the `inputs` context does not exist,
      # so INPUT_DRY_RUN renders empty and the script resolves false — an
      # ordinary tag release always publishes. Only an explicit
      # workflow_dispatch dry_run=true resolves true. The event-name switch
      # lives in scripts/resolve_dry_run.sh, never in ad-hoc YAML string
      # comparisons, and fails closed on any state outside its truth table.
      - name: Resolve canonical dry_run
        id: dry_run
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          dry_run="$(bash scripts/resolve_dry_run.sh "$GITHUB_EVENT_NAME" "$INPUT_DRY_RUN")"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "canonical dry_run: $dry_run (event: $GITHUB_EVENT_NAME)"
      - name: Resolve tag to immutable commit
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          tag="${tag#refs/tags/}"
          sha="$(bash scripts/resolve_release_tag.sh "$tag")"
          bash scripts/verify_release_context.sh "$tag" "$sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release identity: refs/tags/$tag -> $sha"

  # Build wheel + sdist from the exact commit resolved above.
  build:
    name: Build distribution
    needs: resolve_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
      - name: Verify build checkout identity
        env:
          EXPECTED_SHA: ${{ needs.resolve_release.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::build checkout drift: expected $EXPECTED_SHA, got $actual_sha"
            exit 1
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Exact uv pin for the AF-03 release path — the version the
          # GitHub-runner Release Path Proof executed with. Keep in lockstep
          # with ci.yml release-path-proof and requirements/release-tools.in.
          version: "0.12.3"
      - name: Set up Python 3.12 (release-runner interpreter)
        run: uv python install 3.12
      # The exact hash-locked release-tool closure (requirements/release-tools.txt,
      # resolved against Python 3.12) supplies the PEP 517 frontend and the
      # hatchling backend; the build runs with isolation disabled so the backend
      # version is the verified pin, not a float resolved at build time.
      - name: Install hash-locked release tooling and verify tool versions
        run: bash scripts/install_release_tooling.sh --python "$(uv python find 3.12)"
      - name: Build sdist + wheel (no build isolation, exactly one wheel)
        run: bash scripts/build_release_dist.sh
      - name: Show artefacts
        run: ls -la dist/
      - name: Generate SHA-256 hashes
        id: hash
        run: |
          set -euo pipefail
          cd dist
          # base64 of "<sha256>  <filename>" lines, per slsa-framework convention.
          # Hash first, encode second: a sha256sum failure must fail this step
          # rather than attest a silently partial subject list.
          subjects="$(sha256sum *.tar.gz *.whl)"
          echo "hashes=$(printf '%s\n' "$subjects" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Upload artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # SLSA L3 build provenance (in-toto attestation).
  # Externally mutating: signs via keyless OIDC and records to the public
  # Rekor transparency log, so it is gated on the canonical dry_run output.
  # The `== 'false'` form fails closed — a missing or malformed output skips
  # the job rather than running it.
  provenance:
    needs: [resolve_release, build]
    if: needs.resolve_release.outputs.dry_run == 'false'
    permissions:
      actions: read
      id-token: write
      contents: write
    # IMPORTANT: the SLSA generic generator reusable workflow MUST be referenced by a
    # semantic-version TAG. It self-verifies its own ref as refs/tags/vX.Y.Z
    # and fails ("Invalid ref ... Expected ref of the form refs/tags/vX.Y.Z")
    # if pinned by commit SHA. Do NOT let an OpenSSF Scorecard "pin actions by
    # hash" pass rewrite this to a SHA. Tag v2.1.0 == commit
    # f7dd8c54c2067bafc12ca7a55595d5ee9b75204a.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      provenance-name: "alphafold-sovereign-mcp.intoto.jsonl"
      upload-assets: false

  # SBOM (CycloneDX + SPDX). The CycloneDX document is generated from the
  # exact built wheel installed into a dedicated Python 3.12 environment by
  # the hash-locked cyclonedx-py, the wheel's SHA-256 is bound into the SBOM
  # root component, and the binding is independently verified plus proven to
  # fail closed under artifact substitution — the same scripts the
  # unprivileged PR proof job (ci.yml release-path-proof) executes pre-merge.
  sbom:
    needs: [resolve_release, build]
    name: Generate SBOM (CycloneDX + SPDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Exact uv pin for the AF-03 release path — the version the
          # GitHub-runner Release Path Proof executed with. Keep in lockstep
          # with ci.yml release-path-proof and requirements/release-tools.in.
          version: "0.12.3"
      - name: Set up Python 3.12 (release-runner interpreter)
        run: uv python install 3.12
      - name: Install hash-locked release tooling and verify tool versions
        run: bash scripts/install_release_tooling.sh --python "$(uv python find 3.12)"
      - name: Generate CycloneDX from the exact wheel environment and bind wheel SHA-256
        run: bash scripts/generate_release_sbom.sh --python "$(uv python find 3.12)"
      - name: Independently verify SBOM root vs wheel identity and digest
        run: .release-tools/bin/python scripts/verify_sbom_binding.py sbom.cyclonedx.json dist/
      - name: Negative SBOM/wheel substitution tests (must fail closed)
        run: bash scripts/verify_sbom_negative.sh sbom.cyclonedx.json dist/ --python .release-tools/bin/python
      - name: Generate SPDX 2.3 from the installed wheel dependency inventory
        run: .release-tools/bin/python scripts/release_spdx.py generate sbom.cyclonedx.json sbom.spdx.json dist/ --environment .sbom-env
      - name: Independently verify SPDX identity, wheel digest and dependency parity
        run: .release-tools/bin/python scripts/release_spdx.py verify sbom.cyclonedx.json sbom.spdx.json dist/ --environment .sbom-env
      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sboms
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
          retention-days: 7

  # Publish to PyPI via Trusted Publishing (OIDC).
  # Existing files are skipped ONLY if every name and SHA-256 matches.
  # Otherwise publication stops. Do not use skip-existing on mismatched builds.
  publish-pypi:
    needs: [resolve_release, build, provenance, sbom]
    if: needs.resolve_release.outputs.dry_run == 'false'
    name: Publish to PyPI (Trusted Publisher)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/alphafold-sovereign-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Fail closed on pre-existing PyPI filename/digest mismatch
        id: existing
        env:
          TAG: ${{ needs.resolve_release.outputs.tag }}
        run: python3 scripts/release_assets.py pypi dist/ "$TAG" --stage-missing dist-to-publish/ --github-output "$GITHUB_OUTPUT"
      - name: Publish wheel and source archive once
        if: steps.existing.outputs.present == 'false'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist-to-publish/
      - name: Independently read back exact PyPI digests
        env:
          TAG: ${{ needs.resolve_release.outputs.tag }}
        run: python3 scripts/release_assets.py pypi dist/ "$TAG" --require-present

  # Reuse only exact existing assets and signatures. Never clobber a GitHub
  # Release asset, including the nondeterministic keyless Sigstore bundles.
  # All publication branches perform an external readback before completion.
  publish-github:
    needs: [resolve_release, build, provenance, sbom, publish-pypi]
    if: needs.resolve_release.outputs.dry_run == 'false'
    name: Sign and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ needs.resolve_release.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: sboms/
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Recheck PyPI and both wheel-bound SBOMs before signing
        env:
          TAG: ${{ needs.resolve_release.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/release_assets.py pypi dist/ "$TAG" --require-present
          python3 scripts/verify_sbom_binding.py sboms/sbom.cyclonedx.json dist/
          python3 scripts/release_spdx.py verify sboms/sbom.cyclonedx.json sboms/sbom.spdx.json dist/
      - name: Reconcile existing GitHub assets (no mutations)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve_release.outputs.tag }}
        run: python3 scripts/release_assets.py github dist/ sboms/ "$TAG" "$GITHUB_REPOSITORY" release-plan.json
      - name: Sign only missing Sigstore bundles
        run: python3 scripts/release_assets.py sign dist/ sboms/ release-plan.json
      - name: Upload absent assets without replacement and verify readback
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve_release.outputs.tag }}
        run: |
          set -euo pipefail
          # Reconcile a second time immediately before any write.
          python3 scripts/release_assets.py github dist/ sboms/ "$TAG" "$GITHUB_REPOSITORY" release-plan.json
          mapfile -t assets < <(python3 scripts/release_assets.py paths dist/ sboms/ release-plan.json)
          exists="$(python3 -c 'import json; print(json.load(open("release-plan.json"))["exists"])')"
          # Releases are staged as drafts and published only after the complete
          # asset set is read back, so an interruption never exposes a partial
          # public release and a rerun resumes the existing draft.
          if [[ "$exists" == "True" ]]; then
            if (( ${#assets[@]} == 0 )); then
              echo "All existing assets match; no upload required."
            else
              gh release upload "$TAG" "${assets[@]}"
            fi
          else
            args=()
            if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" --draft --verify-tag --title "AlphaFold Sovereign MCP $TAG" --notes-file CHANGELOG.md "${args[@]}" "${assets[@]}"
          fi
          # Staged contents and pre-existing signatures must still match.
          python3 scripts/release_assets.py github dist/ sboms/ "$TAG" "$GITHUB_REPOSITORY" release-readback.json
          python3 - <<'PY'
          import json
          with open("release-readback.json", encoding="utf-8") as stream:
              plan = json.load(stream)
          if not plan["exists"] or plan["missing"]:
              raise SystemExit(f"incomplete release after upload: {plan}")
          print("Release assets verified with no missing assets")
          PY
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open("release-readback.json"))["draft"] else 1)'; then
            gh release edit "$TAG" --draft=false
            python3 scripts/release_assets.py github dist/ sboms/ "$TAG" "$GITHUB_REPOSITORY" release-published.json
            python3 - <<'PY'
          import json
          with open("release-published.json", encoding="utf-8") as stream:
              plan = json.load(stream)
          if not plan["exists"] or plan["draft"] or plan["missing"]:
              raise SystemExit(f"release is not published and complete: {plan}")
          print("Published GitHub Release verified with no missing assets")
          PY
          fi

  # Publish server.json to the official MCP Registry after PyPI is available.
  # Externally mutating: writes to the public MCP Registry. Gated on
  # canonical dry_run (fail-closed `== 'false'` form).
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [resolve_release, publish-pypi]
    if: needs.resolve_release.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
      - name: Verify registry checkout identity
        env:
          EXPECTED_SHA: ${{ needs.resolve_release.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::registry checkout drift: expected $EXPECTED_SHA, got $actual_sha"
            exit 1
          fi
      - name: Install authenticated mcp-publisher
        run: bash scripts/install_mcp_publisher.sh
      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json to MCP Registry
        run: ./mcp-publisher publish

  # Dispatch the post-publish read-back verifier with the released tag once
  # PyPI and the GitHub Release both exist. verify-published-release.yml has
  # no `release:` trigger of its own, and a GITHUB_TOKEN-authored release or
  # tag never fans out to other workflows, so this explicit dispatch is the
  # only in-pipeline path that starts it (its scheduled run covers a publish
  # that never started). Externally mutating (starts another workflow run) and
  # meaningless on a dry run, which publishes nothing to verify: gated on
  # canonical dry_run (fail-closed `== 'false'` form). The dispatched file is
  # the one at the released tag, so re-running this workflow for a tag whose
  # verifier predates the `tag` input fails here with "Unexpected inputs";
  # verify such a tag by dispatching verify-published-release.yml from main.
  dispatch-verify:
    name: Dispatch published-release verification
    needs: [resolve_release, publish-pypi, publish-github]
    if: needs.resolve_release.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      actions: write        # gh workflow run (workflow_dispatch)
    steps:
      - name: Dispatch verify-published-release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The single resolved tag from resolve_release: verify-published-
          # release.yml runs at that ref and is told which release to read.
          VERIFY_TAG: ${{ needs.resolve_release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run verify-published-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$VERIFY_TAG" \
            --field tag="$VERIFY_TAG"
