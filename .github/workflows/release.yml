name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.1.0-rc1)"
        required: true
        type: string

permissions: {}

jobs:
  # Resolve the release tag once, before any build or privileged publication.
  # Every source-reading job consumes the resulting immutable commit SHA.
  resolve_release:
    name: Resolve release identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve tag to immutable commit
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          tag="${tag#refs/tags/}"
          sha="$(bash scripts/resolve_release_tag.sh "$tag")"
          bash scripts/verify_release_context.sh "$tag" "$sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release identity: refs/tags/$tag -> $sha"

  # Build wheel + sdist from the exact commit resolved above.
  build:
    name: Build distribution
    needs: resolve_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
      - name: Verify build checkout identity
        env:
          EXPECTED_SHA: ${{ needs.resolve_release.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::build checkout drift: expected $EXPECTED_SHA, got $actual_sha"
            exit 1
          fi
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Build sdist + wheel
        run: uv build
      - name: Show artefacts
        run: ls -la dist/
      - name: Generate SHA-256 hashes
        id: hash
        run: |
          cd dist
          # base64 of "<sha256>  <filename>" lines, per slsa-framework convention
          echo "hashes=$(sha256sum *.tar.gz *.whl | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Upload artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # SLSA L3 build provenance (in-toto attestation).
  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    # IMPORTANT: the SLSA generator reusable workflow MUST be referenced by a
    # semantic-version TAG. It self-verifies its own ref as refs/tags/vX.Y.Z
    # and fails ("Invalid ref ... Expected ref of the form refs/tags/vX.Y.Z")
    # if pinned by commit SHA. Do NOT let an OpenSSF Scorecard "pin actions by
    # hash" pass rewrite this to a SHA. Tag v2.1.0 == commit
    # f7dd8c54c2067bafc12ca7a55595d5ee9b75204a.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      provenance-name: "alphafold-sovereign-mcp.intoto.jsonl"
      upload-assets: false

  # SBOM (CycloneDX + SPDX). This repository already installs the built wheel
  # into the SBOM environment, so this job is intentionally not redesigned.
  sbom:
    needs: [resolve_release, build]
    name: Generate SBOM (CycloneDX + SPDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Create dedicated SBOM venv and install tooling + package
        run: |
          set -euo pipefail
          uv venv .sbom-env --python 3.12
          uv pip install --python .sbom-env/bin/python cyclonedx-bom
          # Install the just-built wheel into the same venv so the
          # CycloneDX "environment" command sees its real dependency tree.
          uv pip install --python .sbom-env/bin/python dist/*.whl
      - name: Generate CycloneDX JSON
        run: |
          .sbom-env/bin/cyclonedx-py environment -o sbom.cyclonedx.json
      - name: Generate SPDX JSON
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist/
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sboms
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
          retention-days: 7

  # Publish to PyPI via Trusted Publishing (OIDC).
  publish-pypi:
    needs: [build, provenance, sbom]
    name: Publish to PyPI (Trusted Publisher)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/alphafold-sovereign-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish wheel + sdist to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  # Sign artefacts with keyless Sigstore and publish the GitHub Release.
  publish-github:
    needs: [resolve_release, build, provenance, sbom, publish-pypi]
    name: Sign and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
      - name: Verify release checkout identity
        env:
          EXPECTED_SHA: ${{ needs.resolve_release.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::release checkout drift: expected $EXPECTED_SHA, got $actual_sha"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sboms
          path: sboms/
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign each artefact with cosign (keyless OIDC)
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz dist/*.whl; do
            cosign sign-blob --yes "$f" --bundle "${f}.sigstore"
          done
      - name: Create or upload to GitHub release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve_release.outputs.tag }}
        run: |
          set -euo pipefail
          ASSETS=( dist/*.tar.gz dist/*.whl dist/*.sigstore sboms/sbom.cyclonedx.json sboms/sbom.spdx.json )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets with --clobber."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating release $TAG."
            PRERELEASE=""
            if [[ "$TAG" == *-* ]]; then PRERELEASE="--prerelease"; fi
            gh release create "$TAG" \
              --verify-tag \
              --title "AlphaFold Sovereign MCP $TAG" \
              --notes-file CHANGELOG.md \
              $PRERELEASE \
              "${ASSETS[@]}"
          fi

  # Publish server.json to the official MCP Registry after PyPI is available.
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [resolve_release, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
      - name: Verify registry checkout identity
        env:
          EXPECTED_SHA: ${{ needs.resolve_release.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::registry checkout drift: expected $EXPECTED_SHA, got $actual_sha"
            exit 1
          fi
      - name: Install authenticated mcp-publisher
        run: bash scripts/install_mcp_publisher.sh
      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json to MCP Registry
        run: ./mcp-publisher publish
